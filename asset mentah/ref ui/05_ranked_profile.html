<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PASRAHPHOBIA — Ranked Profile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Oswald:wght@300;400;600;700&display=swap');
:root{
  --bg-void:#020408;--bg-dark:#060d12;--bg-card:rgba(12,22,30,0.92);
  --border-dim:rgba(80,160,200,0.15);--fear-blue:#0af;--fear-bright:#3cf;
  --fear-dim:rgba(0,170,255,0.3);--text-primary:#c8dde8;
  --text-dim:rgba(180,210,230,0.5);--text-ghost:rgba(180,210,230,0.2);
  --glow-blue:0 0 8px #0af,0 0 20px rgba(0,170,255,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-void);color:var(--text-primary);font-family:'Share Tech Mono',monospace;}
.noise{position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.4;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 60% 60% at 30% 50%,rgba(0,40,80,0.2) 0%,transparent 65%),#020408;}
.root{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:hidden;}

.topbar{height:clamp(34px,5.5vh,42px);background:rgba(0,0,0,0.75);border-bottom:1px solid var(--border-dim);display:flex;align-items:center;padding:0 max(12px,env(safe-area-inset-left,12px));gap:10px;flex-shrink:0;}
.topbar-logo{font-family:'Creepster',cursive;font-size:clamp(12px,2vw,15px);color:var(--fear-blue);letter-spacing:2px;text-shadow:var(--glow-blue);}
.topbar-title{font-size:clamp(8px,1.1vw,10px);letter-spacing:4px;color:var(--text-dim);text-transform:uppercase;}

.main{flex:1;display:flex;overflow:hidden;padding:max(8px,1vh) max(10px,env(safe-area-inset-left,10px));gap:10px;}

/* LEFT: current rank card */
.panel-left{width:clamp(160px,28vw,230px);display:flex;flex-direction:column;gap:8px;flex-shrink:0;}

.rank-card{background:var(--bg-card);border:1px solid var(--border-dim);padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;}

.rank-hexagon{width:clamp(60px,10vw,86px);height:clamp(60px,10vw,86px);position:relative;display:flex;align-items:center;justify-content:center;}
.hex-outer{width:100%;height:100%;background:conic-gradient(from 0deg,#1470d4,#40a0ff,#1470d4);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(20,112,212,0.4);}
.hex-inner{position:absolute;inset:4px;background:var(--bg-dark);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3.5vw,32px);}

.rank-name{font-family:'Oswald',sans-serif;font-size:clamp(16px,2.8vw,24px);font-weight:700;letter-spacing:3px;color:#40a0ff;text-shadow:0 0 12px rgba(64,160,255,0.5);text-transform:uppercase;}
.rank-tier{font-size:clamp(7px,1vw,9px);color:var(--text-dim);letter-spacing:2px;}

.rank-stars{display:flex;gap:4px;justify-content:center;}
.star{width:clamp(8px,1.4vw,12px);height:clamp(8px,1.4vw,12px);background:#40a0ff;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:0 0 5px rgba(64,160,255,0.6);}
.star.empty{background:rgba(255,255,255,0.1);box-shadow:none;}

.rank-progress-wrap{width:100%;}
.rp-label{display:flex;justify-content:space-between;font-size:clamp(6px,0.8vw,8px);color:var(--text-ghost);margin-bottom:4px;letter-spacing:1px;}
.rp-track{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.rp-fill{height:100%;background:linear-gradient(90deg,#1470d4,#40a0ff);border-radius:2px;box-shadow:0 0 6px rgba(64,160,255,0.5);width:68%;position:relative;overflow:hidden;}
.rp-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shine 2s ease-in-out infinite;}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

.rank-stats{width:100%;display:flex;justify-content:space-around;padding-top:8px;border-top:1px solid var(--border-dim);}
.rs{text-align:center;}
.rs-val{font-family:'Oswald',sans-serif;font-size:clamp(14px,2.2vw,20px);font-weight:600;color:var(--text-primary);}
.rs-label{font-size:clamp(6px,0.7vw,7px);color:var(--text-ghost);text-transform:uppercase;letter-spacing:1px;}

.season-card{background:var(--bg-card);border:1px solid var(--border-dim);padding:10px;display:flex;flex-direction:column;gap:5px;}
.sc-title{font-size:clamp(6px,0.8vw,8px);letter-spacing:3px;color:var(--fear-dim);text-transform:uppercase;}
.sc-name{font-family:'Oswald',sans-serif;font-size:clamp(11px,1.8vw,15px);font-weight:600;color:var(--text-primary);letter-spacing:2px;}
.sc-time{font-size:clamp(6px,0.8vw,8px);color:rgba(255,150,0,0.8);letter-spacing:1px;}

/* RIGHT: tier grid */
.panel-right{flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden;}

.section-label{font-size:clamp(7px,0.9vw,9px);letter-spacing:4px;color:var(--fear-dim);text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--border-dim);flex-shrink:0;}

.tiers-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px;}
.tiers-scroll::-webkit-scrollbar{width:3px;}
.tiers-scroll::-webkit-scrollbar-thumb{background:rgba(0,150,200,0.3);border-radius:2px;}

.tier-row{background:rgba(0,0,0,0.4);border:1px solid var(--border-dim);padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;touch-action:manipulation;transition:all 0.2s;}
.tier-row:active,.tier-row.current{border-color:var(--fear-blue);background:rgba(0,100,160,0.1);}
.tier-row.locked{opacity:0.35;}
.tier-row.current{border-color:var(--fear-bright);}

.tier-icon{font-size:clamp(18px,3vw,26px);width:clamp(26px,4vw,34px);text-align:center;flex-shrink:0;}
.tier-info{flex:1;}
.tier-name{font-family:'Oswald',sans-serif;font-size:clamp(11px,1.8vw,15px);font-weight:600;text-transform:uppercase;letter-spacing:2px;}
.tier-range{font-size:clamp(6px,0.8vw,8px);color:var(--text-ghost);letter-spacing:1px;margin-top:1px;}
.tier-subs{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.tier-sub-badge{font-size:clamp(6px,0.7vw,7px);padding:1px 5px;border:1px solid;letter-spacing:0.5px;text-transform:uppercase;opacity:0.7;}
.tier-sub-badge.done{opacity:1;}
.tier-stars-mini{display:flex;gap:2px;align-items:center;}
.sm-star{width:6px;height:6px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.tier-current-badge{font-size:clamp(6px,0.8vw,7px);padding:2px 7px;border:1px solid rgba(0,200,255,0.4);color:var(--fear-bright);letter-spacing:1px;text-transform:uppercase;flex-shrink:0;}
.tier-lock{font-size:clamp(8px,1vw,10px);color:var(--text-ghost);flex-shrink:0;}

.portrait-warn{display:none;position:fixed;inset:0;z-index:99999;background:#020408;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.portrait-warn .pw-icon{font-size:40px;animation:rotH 1.5s ease-in-out infinite;}
@keyframes rotH{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.portrait-warn .pw-text{font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}
@media(orientation:portrait){.portrait-warn{display:flex;}.root,.bg,.noise{display:none;}}
</style>
</head>
<body>
<div class="noise"></div><div class="bg"></div>
<div class="portrait-warn"><div class="pw-icon">📱</div><div class="pw-text">Putar perangkat ke landscape</div></div>

<div class="root">
  <div class="topbar">
    <div class="topbar-logo">☠ PASRAHPHOBIA</div>
    <div style="width:1px;height:60%;background:var(--border-dim);"></div>
    <div class="topbar-title">RANKED PROFILE</div>
  </div>

  <div class="main">
    <!-- LEFT -->
    <div class="panel-left">
      <div class="rank-card">
        <div class="rank-hexagon">
          <div class="hex-outer"><div class="hex-inner">💎</div></div>
        </div>
        <div class="rank-name">DETEKTIVE</div>
        <div class="rank-tier">Sub-Rank 3 · Season 1</div>
        <div class="rank-stars">
          <div class="star"></div><div class="star"></div>
          <div class="star"></div><div class="star empty"></div><div class="star empty"></div>
        </div>
        <div class="rank-progress-wrap">
          <div class="rp-label"><span>DETEKTIVE 3</span><span>3/5 bintang</span></div>
          <div class="rp-track"><div class="rp-fill" style="width:60%;"></div></div>
        </div>
        <div class="rank-stats">
          <div class="rs"><div class="rs-val" style="color:#6af;">47</div><div class="rs-label">MATCH</div></div>
          <div class="rs"><div class="rs-val" style="color:#4f8;">31</div><div class="rs-label">MENANG</div></div>
          <div class="rs"><div class="rs-val">65%</div><div class="rs-label">WIN RATE</div></div>
        </div>
      </div>
      <div class="season-card">
        <div class="sc-title">▸ SEASON AKTIF</div>
        <div class="sc-name">MALAM TANPA AKHIR</div>
        <div class="sc-time">⏱ Berakhir: 61 Hari 22 Jam</div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="panel-right">
      <div class="section-label">▸ SEMUA TIER RANK</div>
      <div class="tiers-scroll" id="tiers-scroll"></div>
    </div>
  </div>
</div>

<script>
const TIERS=[
  {name:'Bayi',icon:'🍼',color:'#8fa8b8',subs:3,starsPerSub:3,range:'Pemula',unlocked:true,done:true},
  {name:'Balita',icon:'🧸',color:'#8fa8b8',subs:3,starsPerSub:3,range:'Dasar',unlocked:true,done:true},
  {name:'Anak-Anak',icon:'🎒',color:'#1fa862',subs:3,starsPerSub:3,range:'Menengah Bawah',unlocked:true,done:true},
  {name:'Remaja',icon:'⚔️',color:'#1470d4',subs:4,starsPerSub:4,range:'Menengah',unlocked:true,done:true},
  {name:'Dewasa',icon:'🛡️',color:'#40c8e0',subs:5,starsPerSub:5,range:'Menengah Atas',unlocked:true,done:true},
  {name:'Profesional',icon:'🏆',color:'#d4a820',subs:5,starsPerSub:5,range:'Tinggi',unlocked:true,done:true},
  {name:'Detektive',icon:'💎',color:'#40a0ff',subs:5,starsPerSub:5,range:'Sangat Tinggi',unlocked:true,done:false,current:true,currentSub:3,currentStars:3},
  {name:'Sang Ahli',icon:'👑',color:'#e080ff',subs:0,starsPerSub:0,range:'Master · Victory Counter',unlocked:false},
];

const wrap=document.getElementById('tiers-scroll');
wrap.innerHTML=TIERS.map(t=>{
  const isCurrent=t.current;
  const isLocked=!t.unlocked;
  let subsHtml='';
  if(t.subs>0){
    subsHtml='<div class="tier-subs">';
    for(let i=t.subs;i>=1;i--){
      const isDone=t.done||(isCurrent&&i>t.currentSub);
      const isCurSub=isCurrent&&i===t.currentSub;
      const stars=isCurSub?Array.from({length:t.starsPerSub},(_,si)=>`<div class="sm-star" style="background:${si<t.currentStars?t.color:'rgba(255,255,255,0.15)'}"></div>`).join(''):'';
      subsHtml+=`<div class="tier-sub-badge ${isDone?'done':''}" style="border-color:${t.color};color:${isCurSub?t.color:'rgba(180,210,230,0.3)'}">
        ${t.name} ${i} ${stars?`<span class="tier-stars-mini">${stars}</span>`:''}
      </div>`;
    }
    subsHtml+='</div>';
  } else {
    subsHtml=`<div style="font-size:clamp(7px,0.9vw,9px);color:${t.color};letter-spacing:1px;margin-top:2px;">Victory Counter — tidak ada batas</div>`;
  }
  return `<div class="tier-row${isCurrent?' current':''}${isLocked?' locked':''}">
    <div class="tier-icon">${t.icon}</div>
    <div class="tier-info">
      <div class="tier-name" style="color:${t.color};">${t.name}</div>
      <div class="tier-range">${t.range}</div>
      ${subsHtml}
    </div>
    ${isCurrent?'<div class="tier-current-badge">★ RANK KINI</div>':''}
    ${isLocked?'<div class="tier-lock">🔒</div>':''}
  </div>`;
}).join('');
</script>
</body>
</html>
