<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PASRAHPHOBIA — Main Menu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Oswald:wght@300;400;600;700&display=swap');

:root {
  --bg-void: #020408;
  --bg-dark: #060d12;
  --bg-card: rgba(12,22,30,0.88);
  --border-dim: rgba(80,160,200,0.15);
  --fear-blue: #0af;
  --fear-bright: #3cf;
  --fear-dim: rgba(0,170,255,0.3);
  --text-primary: #c8dde8;
  --text-dim: rgba(180,210,230,0.5);
  --text-ghost: rgba(180,210,230,0.2);
  --glow-blue: 0 0 8px #0af, 0 0 20px rgba(0,170,255,0.4);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: 'Share Tech Mono', monospace;
}

/* Force landscape layout */
.screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: row;
  align-items: stretch;
}

/* ── NOISE OVERLAY ── */
.noise {
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.5;
}

/* ── BG LAYERS ── */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 70% 80% at 30% 50%, rgba(0,60,100,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 40% 60% at 80% 70%, rgba(0,20,50,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,80,120,0.1) 0%, transparent 50%),
    #020408;
  animation: bgDrift 10s ease-in-out infinite alternate;
}
@keyframes bgDrift {
  from { opacity: 0.8; }
  to { opacity: 1; }
}

/* ── SCAN LINES ── */
.scanlines {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
}

/* ── LEFT PANEL — LOGO ── */
.left-panel {
  position: relative;
  z-index: 10;
  flex: 1.1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 4vw;
  border-right: 1px solid rgba(0,150,200,0.1);
}

.logo-eyebrow {
  font-size: clamp(7px, 1.2vw, 11px);
  letter-spacing: 5px;
  color: var(--fear-dim);
  text-transform: uppercase;
  margin-bottom: 8px;
  animation: fadeSlideDown 0.8s ease both;
}

.logo-main {
  font-family: 'Creepster', cursive;
  font-size: clamp(28px, 6vw, 64px);
  letter-spacing: 4px;
  color: #fff;
  text-shadow:
    0 0 20px rgba(0,170,255,0.7),
    0 0 60px rgba(0,100,200,0.3),
    0 2px 0 #000;
  line-height: 1;
  text-align: center;
  animation: titleFlicker 4s ease-in-out infinite, fadeSlideDown 0.6s ease both;
}

@keyframes titleFlicker {
  0%,100%{opacity:1}
  92%{opacity:1} 93%{opacity:0.65} 94%{opacity:1} 96%{opacity:0.8} 97%{opacity:1}
}

.logo-divider {
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,170,255,0.4), transparent);
  margin: 12px auto;
  animation: fadeSlideDown 1s ease both;
}

.logo-sub {
  font-size: clamp(7px, 1vw, 9px);
  letter-spacing: 4px;
  color: var(--text-ghost);
  text-transform: uppercase;
  text-align: center;
  line-height: 2;
  animation: fadeSlideDown 1.1s ease both;
}

.logo-studio {
  margin-top: 16px;
  font-size: clamp(7px, 0.9vw, 9px);
  letter-spacing: 3px;
  color: rgba(0,170,255,0.25);
  text-transform: uppercase;
  animation: fadeSlideDown 1.2s ease both;
}

/* Ghost silhouette decoration */
.ghost-deco {
  position: absolute;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(32px, 5vw, 56px);
  opacity: 0.04;
  filter: blur(1px);
  animation: ghostFloat 6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes ghostFloat {
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-8px)}
}

/* ── RIGHT PANEL — BUTTONS ── */
.right-panel {
  position: relative;
  z-index: 10;
  flex: 0.9;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  padding: 0 4vw 0 3vw;
  gap: 6px;
}

/* Version badge top right */
.version-badge {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--text-ghost);
  border: 1px solid rgba(0,150,200,0.1);
  padding: 2px 6px;
}

/* Menu buttons */
.menu-btn {
  position: relative;
  width: 100%;
  padding: clamp(8px, 1.5vh, 14px) 16px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(0,150,200,0.2);
  color: var(--text-dim);
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(9px, 1.4vw, 12px);
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  overflow: hidden;
  transition: all 0.2s;
  -webkit-appearance: none;
  touch-action: manipulation;
  animation: fadeSlideRight 0.5s ease both;
}

.menu-btn:nth-child(1){animation-delay:0.1s}
.menu-btn:nth-child(2){animation-delay:0.15s}
.menu-btn:nth-child(3){animation-delay:0.2s}
.menu-btn:nth-child(4){animation-delay:0.25s}
.menu-btn:nth-child(5){animation-delay:0.3s}
.menu-btn:nth-child(6){animation-delay:0.35s}

.menu-btn::before {
  content: '';
  position: absolute;
  left: -100%; top: 0; bottom: 0;
  width: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,170,255,0.08), transparent);
  transition: left 0.35s;
}
.menu-btn:active::before,
.menu-btn:hover::before { left: 100%; }

.menu-btn:active,
.menu-btn:hover {
  border-color: var(--fear-blue);
  color: var(--fear-bright);
  background: rgba(0,100,160,0.12);
  text-shadow: 0 0 8px var(--fear-blue);
}

.menu-btn.primary {
  border-color: rgba(0,200,255,0.4);
  color: var(--fear-bright);
  background: rgba(0,80,130,0.15);
}
.menu-btn.primary::after {
  content: '';
  position: absolute;
  inset: 0;
  border-left: 2px solid var(--fear-blue);
  pointer-events: none;
}

.menu-btn.danger {
  border-color: rgba(255,0,40,0.15);
  color: rgba(200,100,100,0.6);
}
.menu-btn.danger:active,
.menu-btn.danger:hover {
  border-color: rgba(255,0,40,0.4);
  color: rgba(255,100,100,0.9);
  background: rgba(100,0,20,0.15);
  text-shadow: 0 0 8px rgba(255,0,40,0.4);
}

.btn-icon {
  font-size: clamp(12px, 1.6vw, 16px);
  flex-shrink: 0;
  width: 20px;
  text-align: center;
}

.btn-label { flex: 1; }

.btn-arrow {
  font-size: 10px;
  color: var(--fear-dim);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  transform: translateX(-4px);
}
.menu-btn:active .btn-arrow,
.menu-btn:hover .btn-arrow {
  opacity: 1;
  transform: translateX(0);
}

/* Divider between groups */
.btn-divider {
  height: 1px;
  background: rgba(0,150,200,0.08);
  margin: 2px 0;
}

/* Bottom status bar */
.status-bar {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 28px;
  border-top: 1px solid rgba(0,150,200,0.08);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
  background: rgba(0,0,0,0.3);
}

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #0f8;
  box-shadow: 0 0 6px #0f8;
  animation: statusPulse 2s ease-in-out infinite;
}
@keyframes statusPulse {
  0%,100%{opacity:1} 50%{opacity:0.4}
}

.status-text {
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--text-ghost);
}

/* ── ANIMATIONS ── */
@keyframes fadeSlideDown {
  from { opacity:0; transform:translateY(-12px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes fadeSlideRight {
  from { opacity:0; transform:translateX(16px); }
  to { opacity:1; transform:translateX(0); }
}

/* ── PORTRAIT WARNING ── */
.portrait-warn {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #020408;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  padding: 32px;
}
.portrait-warn .pw-icon { font-size: 40px; animation: rotateHint 1.5s ease-in-out infinite; }
@keyframes rotateHint {
  0%,100%{transform:rotate(0deg)} 50%{transform:rotate(90deg)}
}
.portrait-warn .pw-text {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
}

@media (orientation: portrait) {
  .portrait-warn { display: flex; }
  .screen { display: none; }
}

/* Landscape safe area for notch */
@supports (padding: env(safe-area-inset-left)) {
  .left-panel { padding-left: max(4vw, env(safe-area-inset-left)); }
  .right-panel { padding-right: max(4vw, env(safe-area-inset-right)); }
}
</style>
</head>
<body>

<div class="noise"></div>
<div class="bg-layer"></div>
<div class="scanlines"></div>

<!-- Portrait warning -->
<div class="portrait-warn">
  <div class="pw-icon">📱</div>
  <div class="pw-text">Putar perangkat ke landscape</div>
</div>

<!-- Main screen -->
<div class="screen">

  <!-- LEFT: Logo area -->
  <div class="left-panel">
    <div class="logo-eyebrow">MM NINETEEN STUDIOS</div>
    <div class="logo-main">PASRAH<br>PHOBIA</div>
    <div class="logo-divider"></div>
    <div class="logo-sub">
      INVESTIGASI HOROR PARANORMAL<br>
      HINGGA 4 PEMAIN
    </div>
    <div class="logo-studio">BUILD 2506 · v1.0.0</div>
    <div class="ghost-deco">👻</div>
  </div>

  <!-- RIGHT: Buttons -->
  <div class="right-panel">
    <div class="version-badge">v1.0.0</div>

    <button class="menu-btn primary">
      <span class="btn-icon">▶</span>
      <span class="btn-label">Mulai Game</span>
      <span class="btn-arrow">›</span>
    </button>

    <button class="menu-btn">
      <span class="btn-icon">◉</span>
      <span class="btn-label">Lanjutkan</span>
      <span class="btn-arrow">›</span>
    </button>

    <div class="btn-divider"></div>

    <button class="menu-btn">
      <span class="btn-icon">⚔</span>
      <span class="btn-label">Mode Ranked</span>
      <span class="btn-arrow">›</span>
    </button>

    <button class="menu-btn">
      <span class="btn-icon">✦</span>
      <span class="btn-label">Royal Pass</span>
      <span class="btn-arrow">›</span>
    </button>

    <div class="btn-divider"></div>

    <button class="menu-btn">
      <span class="btn-icon">⚙</span>
      <span class="btn-label">Pengaturan</span>
      <span class="btn-arrow">›</span>
    </button>

    <button class="menu-btn danger">
      <span class="btn-icon">✕</span>
      <span class="btn-label">Keluar</span>
      <span class="btn-arrow">›</span>
    </button>
  </div>

  <!-- Bottom status bar spanning full width -->
  <div class="status-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:20;">
    <div class="status-dot"></div>
    <div class="status-text">SERVER ONLINE</div>
    <div class="status-text" style="margin-left:auto;">© 2025 MMNINETEEN</div>
  </div>

</div>

</body>
</html>
