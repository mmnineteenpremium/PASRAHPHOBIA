<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PASRAHPHOBIA — Inventory</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Oswald:wght@300;400;600;700&display=swap');
:root {
  --bg-void:#020408;--bg-dark:#060d12;--bg-card:rgba(12,22,30,0.92);
  --border-dim:rgba(80,160,200,0.15);--fear-blue:#0af;--fear-bright:#3cf;
  --fear-dim:rgba(0,170,255,0.3);--text-primary:#c8dde8;
  --text-dim:rgba(180,210,230,0.5);--text-ghost:rgba(180,210,230,0.2);
  --glow-blue:0 0 8px #0af,0 0 20px rgba(0,170,255,0.3);
  --common:#5a6472;--uncommon:#1fa862;--rare:#1470d4;--epic:#8820e0;--legendary:#d4920a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-void);color:var(--text-primary);font-family:'Share Tech Mono',monospace;}
.noise{position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.4;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(0,50,90,0.15) 0%,transparent 60%),#020408;}
.root{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{height:clamp(34px,5.5vh,42px);background:rgba(0,0,0,0.75);border-bottom:1px solid var(--border-dim);display:flex;align-items:center;padding:0 max(12px,env(safe-area-inset-left,12px));gap:10px;flex-shrink:0;}
.topbar-logo{font-family:'Creepster',cursive;font-size:clamp(12px,2vw,15px);color:var(--fear-blue);letter-spacing:2px;text-shadow:var(--glow-blue);}
.topbar-title{font-size:clamp(8px,1.1vw,10px);letter-spacing:4px;color:var(--text-dim);text-transform:uppercase;}
.topbar-weight{margin-left:auto;font-size:clamp(7px,1vw,9px);color:var(--text-ghost);letter-spacing:2px;}
.weight-val{color:var(--fear-bright);}

/* MAIN */
.main{flex:1;display:flex;overflow:hidden;padding:max(8px,1vh) max(10px,env(safe-area-inset-left,10px));gap:10px;}

/* FILTER + GRID */
.panel-left{flex:1;display:flex;flex-direction:column;gap:7px;overflow:hidden;}

.filter-row{display:flex;gap:5px;flex-shrink:0;}
.ftab{flex:1;padding:clamp(4px,0.9vh,7px) 4px;background:transparent;border:1px solid var(--border-dim);color:var(--text-ghost);font-family:'Share Tech Mono',monospace;font-size:clamp(6px,0.9vw,8px);letter-spacing:2px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;text-align:center;}
.ftab.active{border-color:var(--fear-blue);color:var(--fear-bright);background:rgba(0,170,255,0.07);}

.inv-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(48px,9vw,68px),1fr));gap:5px;align-content:start;padding-right:4px;}
.inv-grid::-webkit-scrollbar{width:3px;}
.inv-grid::-webkit-scrollbar-thumb{background:rgba(0,150,200,0.3);border-radius:2px;}

.inv-slot{aspect-ratio:1;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.05);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.8vw,26px);transition:all 0.15s;touch-action:manipulation;}
.inv-slot:active,.inv-slot.selected{border-color:var(--fear-bright);box-shadow:var(--glow-blue),inset 0 0 10px rgba(0,170,255,0.06);}
.inv-slot.empty{opacity:0.25;}
.inv-slot.empty:active{opacity:0.35;border-color:rgba(255,255,255,0.08);}
.slot-rarity{position:absolute;inset:0;border-bottom:2px solid transparent;pointer-events:none;}
.slot-rarity.common{border-color:var(--common);}
.slot-rarity.uncommon{border-color:var(--uncommon);}
.slot-rarity.rare{border-color:var(--rare);}
.slot-rarity.epic{border-color:var(--epic);}
.slot-rarity.legendary{border-color:var(--legendary);animation:legGlow 2s ease-in-out infinite alternate;}
@keyframes legGlow{from{box-shadow:inset 0 0 8px rgba(212,146,10,0.1)}to{box-shadow:inset 0 0 18px rgba(212,146,10,0.3),0 0 8px rgba(212,146,10,0.15)}}
.slot-count{position:absolute;bottom:2px;right:3px;font-size:clamp(6px,0.8vw,8px);color:var(--text-dim);}
.slot-dur{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.08);}
.slot-dur-fill{height:100%;border-radius:0 0 0 0;transition:width 0.3s;}

/* SIDEBAR */
.panel-right{width:clamp(130px,22vw,190px);display:flex;flex-direction:column;gap:7px;flex-shrink:0;}

.detail-card{background:var(--bg-card);border:1px solid var(--border-dim);padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;}
.detail-icon{font-size:clamp(28px,5vw,44px);text-align:center;padding:6px 0;}
.detail-name{font-size:clamp(9px,1.3vw,11px);letter-spacing:2px;color:var(--text-primary);text-align:center;text-transform:uppercase;}
.detail-badge{display:block;padding:2px 6px;font-size:clamp(6px,0.8vw,8px);letter-spacing:2px;text-align:center;text-transform:uppercase;margin:0 auto;border:1px solid;}
.detail-badge.common{border-color:var(--common);color:var(--common);}
.detail-badge.uncommon{border-color:var(--uncommon);color:var(--uncommon);}
.detail-badge.rare{border-color:var(--rare);color:var(--rare);}
.detail-badge.epic{border-color:var(--epic);color:var(--epic);}
.detail-badge.legendary{border-color:var(--legendary);color:var(--legendary);}
.detail-desc{font-size:clamp(7px,0.9vw,9px);color:var(--text-dim);line-height:1.7;padding-top:6px;border-top:1px solid var(--border-dim);}
.detail-stats{display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid var(--border-dim);}
.detail-stat-row{display:flex;justify-content:space-between;font-size:clamp(6px,0.8vw,8px);}
.dsl{color:var(--text-ghost);text-transform:uppercase;letter-spacing:1px;}
.dsv{color:var(--text-primary);}

.action-row{display:flex;gap:5px;}
.act-btn{flex:1;padding:clamp(5px,1vh,8px) 4px;background:transparent;border:1px solid var(--border-dim);color:var(--text-dim);font-family:'Share Tech Mono',monospace;font-size:clamp(6px,0.8vw,8px);letter-spacing:1px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;text-align:center;}
.act-btn:active{border-color:var(--fear-blue);color:var(--fear-bright);}
.act-btn.danger:active{border-color:#f03;color:#f55;}

.equip-card{background:var(--bg-card);border:1px solid var(--border-dim);padding:8px;}
.equip-title{font-size:clamp(6px,0.8vw,8px);letter-spacing:3px;color:var(--fear-dim);text-transform:uppercase;margin-bottom:6px;}
.equip-slots{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.equip-slot{background:rgba(0,0,0,0.35);border:1px dashed rgba(0,150,200,0.2);padding:6px 4px;text-align:center;font-size:clamp(14px,2vw,18px);cursor:pointer;touch-action:manipulation;transition:all 0.2s;}
.equip-slot:active{border-color:var(--fear-blue);border-style:solid;}
.equip-slot-label{display:block;font-size:clamp(5px,0.7vw,7px);color:var(--text-ghost);letter-spacing:0.5px;text-transform:uppercase;margin-top:2px;}

/* PORTRAIT */
.portrait-warn{display:none;position:fixed;inset:0;z-index:99999;background:#020408;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.portrait-warn .pw-icon{font-size:40px;animation:rotH 1.5s ease-in-out infinite;}
@keyframes rotH{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.portrait-warn .pw-text{font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}
@media(orientation:portrait){.portrait-warn{display:flex;}.root,.bg,.noise{display:none;}}
</style>
</head>
<body>
<div class="noise"></div><div class="bg"></div>
<div class="portrait-warn"><div class="pw-icon">📱</div><div class="pw-text">Putar perangkat ke landscape</div></div>

<div class="root">
  <div class="topbar">
    <div class="topbar-logo">☠ PASRAHPHOBIA</div>
    <div style="width:1px;height:60%;background:var(--border-dim);"></div>
    <div class="topbar-title">INVENTORY</div>
    <div class="topbar-weight">BERAT: <span class="weight-val">12.4</span> / 20 kg</div>
  </div>

  <div class="main">
    <div class="panel-left">
      <div class="filter-row">
        <button class="ftab active" onclick="setFilter('semua',this)">SEMUA</button>
        <button class="ftab" onclick="setFilter('alat',this)">ALAT</button>
        <button class="ftab" onclick="setFilter('item',this)">ITEM</button>
        <button class="ftab" onclick="setFilter('kunci',this)">KUNCI</button>
        <button class="ftab" onclick="setFilter('quest',this)">QUEST</button>
      </div>
      <div class="inv-grid" id="inv-grid"></div>
    </div>

    <div class="panel-right">
      <div class="detail-card" id="detail-card">
        <div class="detail-icon" id="d-icon">🎒</div>
        <div class="detail-name" id="d-name">PILIH ITEM</div>
        <span class="detail-badge common" id="d-badge">COMMON</span>
        <div class="detail-desc" id="d-desc">Klik item di grid untuk melihat detail.</div>
        <div class="detail-stats" id="d-stats"></div>
      </div>
      <div class="action-row">
        <button class="act-btn" onclick="alert('Equipped!')">PAKAI</button>
        <button class="act-btn" onclick="alert('Inspect!')">CEK</button>
        <button class="act-btn danger" onclick="alert('Dropped!')">BUANG</button>
      </div>
      <div class="equip-card">
        <div class="equip-title">▸ EQUIP SLOT</div>
        <div class="equip-slots">
          <div class="equip-slot">🔦<span class="equip-slot-label">KANAN</span></div>
          <div class="equip-slot" style="opacity:0.3;font-size:10px;">—<span class="equip-slot-label">KIRI</span></div>
          <div class="equip-slot" style="opacity:0.3;font-size:10px;">—<span class="equip-slot-label">TUBUH</span></div>
          <div class="equip-slot" style="opacity:0.3;font-size:10px;">—<span class="equip-slot-label">KEPALA</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const ITEMS=[
  {icon:'🔦',name:'Senter Taktis',rarity:'legendary',cat:'alat',desc:'Senter militer. Cahayanya tidak pernah padam.',stat:'Durabilitas: 87%',weight:'0.8 kg',dur:87},
  {icon:'🗝️',name:'Kunci Gudang',rarity:'rare',cat:'kunci',desc:'Kunci berkarat dengan simbol aneh.',stat:'Kondisi: Baik',weight:'0.1 kg',count:2},
  {icon:'📖',name:'Jurnal Tua',rarity:'epic',cat:'quest',desc:'Halaman terakhirnya tidak terbaca.',stat:'Kondisi: Rusak',weight:'0.4 kg'},
  {icon:'💊',name:'Obat Penenang',rarity:'uncommon',cat:'item',desc:'+15 sanity per pakai.',stat:'+15 Sanity',weight:'0.2 kg',count:4},
  {icon:'🕯️',name:'Lilin',rarity:'common',cat:'item',desc:'Cahaya kecil. Tidak tahan angin.',stat:'Sisa: 60%',weight:'0.1 kg',count:3,dur:60},
  {icon:'📻',name:'Radio Tua',rarity:'common',cat:'alat',desc:'Terkadang menangkap sinyal aneh.',stat:'Baterai: 40%',weight:'0.6 kg',dur:40},
  {icon:'🔫',name:'Pistol Flare',rarity:'rare',cat:'alat',desc:'2 peluru tersisa.',stat:'Ammo: 2/2',weight:'0.9 kg',count:2},
  {icon:'🩹',name:'Perban',rarity:'common',cat:'item',desc:'+20 HP.',stat:'+20 HP',weight:'0.1 kg',count:6},
  {icon:'🔮',name:'Jimat Aneh',rarity:'epic',cat:'alat',desc:'Bergetar saat hantu mendekat.',stat:'Pasif: Deteksi',weight:'0.3 kg'},
  {icon:'🧪',name:'Cairan Mistik',rarity:'uncommon',cat:'item',desc:'Efek tidak diketahui.',stat:'???',weight:'0.2 kg',count:2},
  {icon:'🗡️',name:'Belati Tua',rarity:'rare',cat:'alat',desc:'Tidak berguna melawan hantu.',stat:'ATK: 5',weight:'0.5 kg'},
  {icon:'📜',name:'Dokumen Ritual',rarity:'epic',cat:'quest',desc:'Berisi simbol yang tidak dikenal.',stat:'Quest Item',weight:'0.2 kg'},
];

let currentFilter='semua';

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const grid=document.getElementById('inv-grid');
  const filtered=ITEMS.filter(i=>currentFilter==='semua'||i.cat===currentFilter);
  let html=filtered.map((item,idx)=>{
    const durBar=item.dur!=null?`<div class="slot-dur"><div class="slot-dur-fill" style="width:${item.dur}%;background:${item.dur>50?'#0f8':item.dur>25?'#fa0':'#f03'};"></div></div>`:'';
    const count=item.count?`<div class="slot-count">×${item.count}</div>`:'';
    return `<div class="inv-slot" onclick="selectItem(${ITEMS.indexOf(item)})">
      <div class="slot-rarity ${item.rarity}"></div>
      ${item.icon}${count}${durBar}
    </div>`;
  }).join('');
  // empty slots
  const empties=Math.max(0,20-filtered.length);
  for(let i=0;i<empties;i++) html+=`<div class="inv-slot empty">+</div>`;
  grid.innerHTML=html;
}

function selectItem(idx){
  const item=ITEMS[idx];
  document.querySelectorAll('.inv-slot').forEach(s=>s.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  document.getElementById('d-icon').textContent=item.icon;
  document.getElementById('d-name').textContent=item.name.toUpperCase();
  const badge=document.getElementById('d-badge');
  badge.className=`detail-badge ${item.rarity}`;
  const labels={legendary:'◆ LEGENDARY',epic:'◉ EPIC',rare:'◈ RARE',uncommon:'◇ UNCOMMON',common:'○ COMMON'};
  badge.textContent=labels[item.rarity];
  document.getElementById('d-desc').textContent=item.desc;
  document.getElementById('d-stats').innerHTML=`
    <div class="detail-stat-row"><span class="dsl">Status</span><span class="dsv">${item.stat}</span></div>
    <div class="detail-stat-row"><span class="dsl">Berat</span><span class="dsv">${item.weight}</span></div>
    <div class="detail-stat-row"><span class="dsl">Kategori</span><span class="dsv">${item.cat.toUpperCase()}</span></div>`;
}

renderGrid();
</script>
</body>
</html>
