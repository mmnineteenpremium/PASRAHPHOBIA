<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PASRAHPHOBIA — Daily</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Oswald:wght@300;400;600;700&display=swap');
:root{--bg-void:#020408;--bg-dark:#060d12;--bg-card:rgba(12,22,30,0.92);--border-dim:rgba(80,160,200,0.15);--fear-blue:#0af;--fear-bright:#3cf;--fear-dim:rgba(0,170,255,0.3);--text-primary:#c8dde8;--text-dim:rgba(180,210,230,0.5);--text-ghost:rgba(180,210,230,0.2);--glow-blue:0 0 8px #0af,0 0 20px rgba(0,170,255,0.3);--gold:#d4920a;--gold-dim:rgba(212,146,10,0.15);--uncommon:#1fa862;--rare:#1470d4;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-void);color:var(--text-primary);font-family:'Share Tech Mono',monospace;}
.noise{position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.4;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(212,146,10,0.06) 0%,transparent 55%),#020408;}
.root{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;}
.topbar{height:clamp(34px,5.5vh,42px);background:rgba(0,0,0,0.75);border-bottom:1px solid var(--border-dim);display:flex;align-items:center;padding:0 max(12px,env(safe-area-inset-left,12px));gap:10px;flex-shrink:0;}
.topbar-logo{font-family:'Creepster',cursive;font-size:clamp(12px,2vw,15px);color:var(--fear-blue);letter-spacing:2px;text-shadow:var(--glow-blue);}
.topbar-title{font-size:clamp(8px,1.1vw,10px);letter-spacing:4px;color:var(--text-dim);text-transform:uppercase;}
.main{flex:1;overflow:hidden;display:flex;padding:max(8px,1vh) max(10px,env(safe-area-inset-left,10px));gap:10px;}

/* CHECK-IN LEFT */
.panel-checkin{width:clamp(160px,30vw,240px);display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.section-label{font-size:clamp(7px,0.9vw,9px);letter-spacing:4px;color:var(--fear-dim);text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--border-dim);flex-shrink:0;}
.checkin-streak{background:var(--bg-card);border:1px solid var(--border-dim);padding:10px;text-align:center;}
.streak-val{font-family:'Oswald',sans-serif;font-size:clamp(24px,4vw,36px);font-weight:700;color:var(--gold);text-shadow:0 0 12px rgba(212,146,10,0.4);}
.streak-label{font-size:clamp(7px,0.9vw,8px);letter-spacing:2px;color:var(--text-ghost);text-transform:uppercase;}
.checkin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:1;}
.ci-day{background:rgba(0,0,0,0.4);border:1px solid var(--border-dim);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;touch-action:manipulation;transition:all 0.2s;position:relative;}
.ci-day.claimed{background:rgba(212,146,10,0.08);border-color:rgba(212,146,10,0.3);}
.ci-day.claimed::after{content:'✓';position:absolute;top:2px;right:3px;font-size:8px;color:var(--gold);}
.ci-day.today{border-color:var(--fear-bright);box-shadow:0 0 8px rgba(0,200,255,0.2);animation:todayPulse 2s ease-in-out infinite;}
@keyframes todayPulse{0%,100%{box-shadow:0 0 6px rgba(0,200,255,0.15)}50%{box-shadow:0 0 14px rgba(0,200,255,0.35)}}
.ci-day.locked{opacity:0.3;}
.ci-icon{font-size:clamp(14px,2.2vw,20px);}
.ci-label{font-size:clamp(5px,0.7vw,7px);letter-spacing:0.5px;color:var(--text-ghost);text-transform:uppercase;}
.ci-val{font-size:clamp(6px,0.8vw,8px);color:var(--text-dim);}
.ci-day-num{position:absolute;bottom:2px;left:3px;font-size:clamp(5px,0.7vw,6px);color:var(--text-ghost);}
.claim-btn{padding:clamp(6px,1.2vh,10px);background:rgba(212,146,10,0.1);border:1px solid rgba(212,146,10,0.4);color:var(--gold);font-family:'Share Tech Mono',monospace;font-size:clamp(8px,1.1vw,10px);letter-spacing:3px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;text-align:center;}
.claim-btn:active{background:rgba(212,146,10,0.25);box-shadow:0 0 12px rgba(212,146,10,0.3);}
.claim-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* RIGHT: reward + mission */
.panel-right{flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden;}

/* Daily reward */
.reward-card{background:var(--bg-card);border:1px solid var(--border-dim);padding:10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.reward-today{display:flex;align-items:center;gap:12px;}
.reward-icon-big{font-size:clamp(28px,4.5vw,40px);}
.reward-info{flex:1;}
.reward-title{font-family:'Oswald',sans-serif;font-size:clamp(12px,1.8vw,16px);font-weight:600;color:var(--text-primary);letter-spacing:2px;}
.reward-sub{font-size:clamp(7px,0.9vw,9px);color:var(--text-dim);margin-top:2px;letter-spacing:1px;}
.reward-val{font-family:'Oswald',sans-serif;font-size:clamp(18px,3vw,26px);font-weight:700;color:var(--gold);letter-spacing:2px;text-align:right;}

/* Missions */
.missions-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.missions-wrap::-webkit-scrollbar{width:3px;}
.missions-wrap::-webkit-scrollbar-thumb{background:rgba(0,150,200,0.3);border-radius:2px;}

.mission-card{background:rgba(0,0,0,0.4);border:1px solid var(--border-dim);padding:8px 10px;display:flex;align-items:center;gap:10px;transition:all 0.2s;}
.mission-card.done{border-color:rgba(0,255,130,0.2);background:rgba(0,100,60,0.08);}
.mission-icon{font-size:clamp(16px,2.5vw,22px);flex-shrink:0;width:clamp(24px,4vw,32px);text-align:center;}
.mission-info{flex:1;}
.mission-name{font-size:clamp(9px,1.3vw,11px);color:var(--text-primary);letter-spacing:1px;}
.mission-progress-wrap{margin-top:4px;}
.mission-prog-text{font-size:clamp(6px,0.8vw,8px);color:var(--text-ghost);letter-spacing:1px;margin-bottom:2px;}
.mission-track{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.mission-fill{height:100%;border-radius:2px;transition:width 0.5s ease;}
.mission-reward{font-family:'Oswald',sans-serif;font-size:clamp(12px,2vw,16px);font-weight:600;color:var(--gold);flex-shrink:0;letter-spacing:1px;}
.mission-claim{padding:4px 10px;background:transparent;border:1px solid rgba(0,255,130,0.4);color:#0f8;font-family:'Share Tech Mono',monospace;font-size:clamp(6px,0.8vw,8px);letter-spacing:1px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;flex-shrink:0;}
.mission-claim:active{background:rgba(0,255,130,0.1);}
.mission-done-badge{font-size:clamp(6px,0.8vw,8px);padding:3px 8px;border:1px solid rgba(0,255,130,0.3);color:rgba(0,255,130,0.7);letter-spacing:1px;text-transform:uppercase;flex-shrink:0;}

/* ALL MISSION BONUS */
.all-mission-bonus{background:rgba(212,146,10,0.06);border:1px solid rgba(212,146,10,0.25);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.amb-icon{font-size:clamp(16px,2.5vw,22px);}
.amb-info{flex:1;}
.amb-title{font-size:clamp(8px,1.1vw,10px);color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
.amb-sub{font-size:clamp(6px,0.8vw,8px);color:var(--text-ghost);letter-spacing:1px;margin-top:1px;}
.amb-val{font-family:'Oswald',sans-serif;font-size:clamp(14px,2.2vw,18px);font-weight:700;color:var(--gold);}

.portrait-warn{display:none;position:fixed;inset:0;z-index:99999;background:#020408;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.portrait-warn .pw-icon{font-size:40px;animation:rotH 1.5s ease-in-out infinite;}
@keyframes rotH{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.portrait-warn .pw-text{font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}
@media(orientation:portrait){.portrait-warn{display:flex;}.root,.bg,.noise{display:none;}}
</style>
</head>
<body>
<div class="noise"></div><div class="bg"></div>
<div class="portrait-warn"><div class="pw-icon">📱</div><div class="pw-text">Putar perangkat ke landscape</div></div>

<div class="root">
  <div class="topbar">
    <div class="topbar-logo">☠ PASRAHPHOBIA</div>
    <div style="width:1px;height:60%;background:var(--border-dim);"></div>
    <div class="topbar-title">DAILY REWARD & MISI</div>
  </div>
  <div class="main">

    <!-- LEFT: check-in -->
    <div class="panel-checkin">
      <div class="section-label">▸ CHECK-IN 7 HARI</div>
      <div class="checkin-streak">
        <div class="streak-val">4</div>
        <div class="streak-label">Hari Berturut-turut</div>
      </div>
      <div class="checkin-grid" id="checkin-grid"></div>
      <button class="claim-btn" id="claim-checkin-btn" onclick="claimCheckin()">✦ KLAIM HARI INI</button>
    </div>

    <!-- RIGHT -->
    <div class="panel-right">
      <!-- Today's reward banner -->
      <div class="reward-card">
        <div class="section-label">▸ HADIAH HARI INI</div>
        <div class="reward-today">
          <div class="reward-icon-big">🪙</div>
          <div class="reward-info">
            <div class="reward-title">HADIAH HARI KE-4</div>
            <div class="reward-sub">Check-in berturut-turut · Bonus streak aktif</div>
          </div>
          <div class="reward-val">1.500 MM</div>
        </div>
      </div>

      <!-- All mission bonus -->
      <div class="all-mission-bonus">
        <div class="amb-icon">🏆</div>
        <div class="amb-info">
          <div class="amb-title">BONUS SEMUA MISI SELESAI</div>
          <div class="amb-sub">Selesaikan 3 misi harian untuk bonus tambahan</div>
        </div>
        <div class="amb-val">+2.000 MM</div>
      </div>

      <!-- Missions -->
      <div class="section-label">▸ MISI HARIAN</div>
      <div class="missions-wrap" id="missions-wrap"></div>
    </div>
  </div>
</div>

<script>
const CHECKIN_DAYS=[
  {day:1,icon:'🪙',val:'1.000 MM',claimed:true},
  {day:2,icon:'🪙',val:'1.000 MM',claimed:true},
  {day:3,icon:'🪙',val:'1.000 MM',claimed:true},
  {day:4,icon:'🪙',val:'1.500 MM',claimed:false,today:true},
  {day:5,icon:'🎁',val:'Item Acak',claimed:false,locked:true},
  {day:6,icon:'🪙',val:'1.500 MM',claimed:false,locked:true},
  {day:7,icon:'🎁',val:'Item Langka',claimed:false,locked:true},
];

const MISSIONS=[
  {icon:'🔍',name:'Selesaikan 1 Investigasi',prog:1,total:1,reward:'1.000 MM',done:true,claimed:false,fill:'#0f8'},
  {icon:'💀',name:'Temukan 3 Bukti Paranormal',prog:2,total:3,reward:'1.000 MM',done:false,claimed:false,fill:'#0af'},
  {icon:'👻',name:'Selamat dari 1 Hunt',prog:0,total:1,reward:'1.000 MM',done:false,claimed:false,fill:'#f80'},
];

function renderCheckin(){
  document.getElementById('checkin-grid').innerHTML=CHECKIN_DAYS.map(d=>`
    <div class="ci-day${d.claimed?' claimed':''}${d.today?' today':''}${d.locked?' locked':''}">
      <div class="ci-icon">${d.icon}</div>
      <div class="ci-val">${d.val}</div>
      <div class="ci-day-num">H${d.day}</div>
    </div>`).join('');
  const today=CHECKIN_DAYS.find(d=>d.today);
  const btn=document.getElementById('claim-checkin-btn');
  if(today&&today.claimed){btn.textContent='✓ SUDAH DIKLAIM';btn.disabled=true;}
}

function claimCheckin(){
  const today=CHECKIN_DAYS.find(d=>d.today);
  if(today){today.claimed=true;}
  renderCheckin();
}

function renderMissions(){
  document.getElementById('missions-wrap').innerHTML=MISSIONS.map((m,i)=>{
    const pct=Math.min(100,(m.prog/m.total)*100);
    const actionHtml=m.done
      ?(m.claimed?'<div class="mission-done-badge">✓ DIKLAIM</div>':`<button class="mission-claim" onclick="claimMission(${i})">KLAIM</button>`)
      :'';
    return `<div class="mission-card${m.done?' done':''}">
      <div class="mission-icon">${m.icon}</div>
      <div class="mission-info">
        <div class="mission-name">${m.name}</div>
        <div class="mission-progress-wrap">
          <div class="mission-prog-text">${m.prog} / ${m.total}</div>
          <div class="mission-track"><div class="mission-fill" style="width:${pct}%;background:${m.fill};box-shadow:0 0 5px ${m.fill}40;"></div></div>
        </div>
      </div>
      <div class="mission-reward">${m.reward}</div>
      ${actionHtml}
    </div>`;
  }).join('');
}

function claimMission(idx){
  MISSIONS[idx].claimed=true;
  renderMissions();
}

renderCheckin();
renderMissions();
</script>
</body>
</html>
