<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PASRAHPHOBIA — Monthly Reward</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Oswald:wght@300;400;600;700&display=swap');
:root{--bg-void:#020408;--bg-dark:#060d12;--bg-card:rgba(12,22,30,0.92);--border-dim:rgba(80,160,200,0.15);--fear-blue:#0af;--fear-bright:#3cf;--fear-dim:rgba(0,170,255,0.3);--text-primary:#c8dde8;--text-dim:rgba(180,210,230,0.5);--text-ghost:rgba(180,210,230,0.2);--glow-blue:0 0 8px #0af,0 0 20px rgba(0,170,255,0.3);--gold:#d4920a;--detective:#9b59b6;--dukun:#0cc;--common:#5a6472;--uncommon:#1fa862;--rare:#1470d4;--epic:#8820e0;--legendary:#d4920a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-void);color:var(--text-primary);font-family:'Share Tech Mono',monospace;}
.noise{position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.4;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(155,89,182,0.07) 0%,transparent 55%),#020408;}
.root{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{height:clamp(34px,5.5vh,42px);background:rgba(0,0,0,0.75);border-bottom:1px solid var(--border-dim);display:flex;align-items:center;padding:0 max(12px,env(safe-area-inset-left,12px));gap:10px;flex-shrink:0;}
.topbar-logo{font-family:'Creepster',cursive;font-size:clamp(12px,2vw,15px);color:var(--fear-blue);letter-spacing:2px;text-shadow:var(--glow-blue);}
.topbar-title{font-size:clamp(8px,1.1vw,10px);letter-spacing:4px;color:var(--text-dim);text-transform:uppercase;}

/* SEASON HEADER */
.season-bar{background:rgba(0,0,0,0.5);border-bottom:1px solid var(--border-dim);padding:clamp(6px,1vh,9px) max(12px,env(safe-area-inset-left,12px));display:flex;align-items:center;gap:clamp(10px,2vw,20px);flex-shrink:0;}
.sb-info{flex-shrink:0;}
.sb-label{font-size:clamp(6px,0.8vw,8px);letter-spacing:3px;color:var(--fear-dim);text-transform:uppercase;}
.sb-name{font-family:'Oswald',sans-serif;font-size:clamp(12px,1.8vw,16px);font-weight:600;letter-spacing:2px;color:var(--text-primary);}
.sb-prog{flex:1;}
.sb-prog-row{display:flex;justify-content:space-between;font-size:clamp(6px,0.8vw,8px);color:var(--text-dim);margin-bottom:3px;letter-spacing:1px;}
.sb-track{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.sb-fill{height:100%;border-radius:2px;width:33%;position:relative;overflow:hidden;}
.sb-fill.dukun{background:linear-gradient(90deg,var(--dukun),#0ee);box-shadow:0 0 8px rgba(0,200,200,0.4);}
.sb-fill.detective{background:linear-gradient(90deg,var(--detective),#c07edc);box-shadow:0 0 8px rgba(155,89,182,0.4);}
.sb-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shine 2s ease-in-out infinite;}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.sb-time{font-size:clamp(6px,0.8vw,8px);color:rgba(255,150,0,0.8);margin-top:2px;letter-spacing:1px;}
.sb-btns{display:flex;gap:5px;flex-shrink:0;}
.sb-buy{padding:clamp(4px,0.9vh,7px) clamp(8px,1.5vw,14px);border:1px solid;font-family:'Share Tech Mono',monospace;font-size:clamp(6px,0.9vw,8px);letter-spacing:1px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;}
.sb-buy.dukun{border-color:rgba(0,200,200,0.4);color:var(--dukun);}
.sb-buy.detective{border-color:rgba(155,89,182,0.5);color:var(--detective);}
.sb-buy:active{transform:scale(0.97);}
.sb-buy-price{font-size:clamp(5px,0.7vw,7px);opacity:0.7;}

/* PASS TABS */
.pass-tabs{display:flex;border-bottom:1px solid var(--border-dim);flex-shrink:0;}
.pass-tab{flex:1;padding:clamp(5px,1vh,8px);background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-ghost);font-family:'Share Tech Mono',monospace;font-size:clamp(7px,1vw,9px);letter-spacing:2px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;text-align:center;}
.pass-tab.active.dukun{border-bottom-color:var(--dukun);color:var(--dukun);}
.pass-tab.active.detective{border-bottom-color:var(--detective);color:var(--detective);}

/* SLIDE TRACK */
.slide-area{flex:1;overflow:hidden;position:relative;}
.slide-track{display:flex;height:100%;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);will-change:transform;}
.slide-page{min-width:100%;height:100%;padding:max(6px,1vh) max(10px,env(safe-area-inset-left,10px));display:flex;flex-direction:column;gap:6px;overflow:hidden;}

/* PAGE INDICATOR */
.page-indicator{display:flex;justify-content:center;align-items:center;gap:5px;height:clamp(18px,3vh,24px);flex-shrink:0;}
.pi-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all 0.2s;cursor:pointer;touch-action:manipulation;}
.pi-dot.active{width:20px;border-radius:3px;background:var(--fear-blue);}
.pi-arrows{display:flex;gap:8px;}
.pi-arrow{padding:3px 10px;background:transparent;border:1px solid var(--border-dim);color:var(--text-dim);font-family:'Share Tech Mono',monospace;font-size:clamp(8px,1vw,10px);cursor:pointer;touch-action:manipulation;transition:all 0.15s;}
.pi-arrow:active{border-color:var(--fear-blue);color:var(--fear-bright);}

/* REWARD GRID per page */
.rw-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:5px;}
.rw-cell{background:var(--bg-card);border:1px solid var(--border-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer;touch-action:manipulation;transition:all 0.15s;overflow:hidden;}
.rw-cell:active{transform:translateY(-1px);}
.rw-cell.premium{background:linear-gradient(135deg,rgba(20,50,90,0.4),rgba(10,30,60,0.6));}
.rw-cell.premium.dukun-theme{background:linear-gradient(135deg,rgba(0,80,80,0.3),rgba(0,40,50,0.5));}
.rw-cell.premium.detective-theme{background:linear-gradient(135deg,rgba(60,20,80,0.3),rgba(40,10,60,0.5));}
.rw-cell.claimed::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#0f8;font-size:clamp(16px,2.5vw,22px);}
.rw-cell.today{border-color:var(--fear-bright);box-shadow:0 0 8px rgba(0,200,255,0.2);}
.rw-cell.legendary-glow{animation:legGlow 2s ease-in-out infinite alternate;}
@keyframes legGlow{from{box-shadow:0 0 6px rgba(212,146,10,0.2)}to{box-shadow:0 0 16px rgba(212,146,10,0.5)}}
.rw-day{position:absolute;top:2px;left:3px;font-size:clamp(5px,0.7vw,6px);color:var(--text-ghost);}
.rw-icon{font-size:clamp(16px,2.5vw,22px);position:relative;}
.rw-name{font-size:clamp(5px,0.7vw,7px);color:var(--text-dim);text-align:center;position:relative;padding:0 2px;line-height:1.3;}
.rw-tier{font-size:clamp(5px,0.6vw,6px);text-transform:uppercase;letter-spacing:0.5px;position:relative;}
.rw-tier.legendary{color:var(--legendary);}
.rw-tier.epic{color:#b8f;}
.rw-tier.rare{color:#6af;}
.rw-tier.uncommon{color:#4f8;}
.rw-tier.common{color:var(--text-ghost);}
.rw-bar{position:absolute;bottom:0;left:0;right:0;height:2px;}
.rw-bar.legendary{background:var(--legendary);box-shadow:0 0 5px rgba(212,146,10,0.6);}
.rw-bar.epic{background:var(--epic);}
.rw-bar.rare{background:var(--rare);}
.rw-bar.uncommon{background:var(--uncommon);}
.rw-bar.common{background:var(--common);}
.free-label{position:absolute;top:2px;right:3px;font-size:clamp(5px,0.6vw,6px);color:rgba(0,255,130,0.6);letter-spacing:0.5px;}

.portrait-warn{display:none;position:fixed;inset:0;z-index:99999;background:#020408;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.portrait-warn .pw-icon{font-size:40px;animation:rotH 1.5s ease-in-out infinite;}
@keyframes rotH{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.portrait-warn .pw-text{font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}
@media(orientation:portrait){.portrait-warn{display:flex;}.root,.bg,.noise{display:none;}}
</style>
</head>
<body>
<div class="noise"></div><div class="bg"></div>
<div class="portrait-warn"><div class="pw-icon">📱</div><div class="pw-text">Putar perangkat ke landscape</div></div>

<div class="root">
  <div class="topbar">
    <div class="topbar-logo">☠ PASRAHPHOBIA</div>
    <div style="width:1px;height:60%;background:var(--border-dim);"></div>
    <div class="topbar-title">MONTHLY REWARD</div>
  </div>

  <!-- SEASON BAR -->
  <div class="season-bar">
    <div class="sb-info">
      <div class="sb-label">SEASON 1 · 30 HARI</div>
      <div class="sb-name">MALAM TANPA AKHIR</div>
    </div>
    <div class="sb-prog">
      <div class="sb-prog-row"><span>Hari <b id="cur-day" style="color:var(--fear-bright)">10</b> / 30</span><span id="prog-label">Kelas Dukun Aktif</span></div>
      <div class="sb-track"><div class="sb-fill dukun" id="sb-fill" style="width:33%;"></div></div>
      <div class="sb-time">⏱ Berakhir: 20 Hari 14 Jam</div>
    </div>
    <div class="sb-btns">
      <button class="sb-buy dukun" onclick="buyPass('dukun')">KELAS DUKUN<span class="sb-buy-price">200 Robux</span></button>
      <button class="sb-buy detective" onclick="buyPass('detective')">KELAS DETEKTIF<span class="sb-buy-price">500 Robux</span></button>
    </div>
  </div>

  <!-- TABS -->
  <div class="pass-tabs">
    <button class="pass-tab active dukun" onclick="setTab('dukun',this)">KELAS DUKUN</button>
    <button class="pass-tab detective" onclick="setTab('detective',this)">KELAS DETEKTIF</button>
  </div>

  <!-- SLIDE AREA -->
  <div class="slide-area" id="slide-area">
    <div class="slide-track" id="slide-track"></div>
  </div>

  <!-- PAGE INDICATOR -->
  <div class="page-indicator">
    <button class="pi-arrow" onclick="slideTo(currentPage-1)">‹</button>
    <div id="dots"></div>
    <button class="pi-arrow" onclick="slideTo(currentPage+1)">›</button>
  </div>
</div>

<script>
// 30 days split into 3 pages of 10
const PASS={
  dukun:{
    theme:'dukun',color:'var(--dukun)',
    days:Array.from({length:30},(_,i)=>{
      const d=i+1;
      const premiumIcons=['🌙','⚗️','🔮','🧿','💀','🌑','🕷️','🩸','🎭','🔱','🌪️','🦇','🕯️','☠️','🌊','🗡️','🧬','🌿','🎪','🔒','💫','🧲','⚡','🌀','🎯','🦉','🧪','🔥','🌈','⚜️'];
      const freeIcons=['🪙','🪙','🪙','🎁','🪙','🪙','🎁','🪙','🪙','🎁','🪙','🪙','🪙','🎁','🪙','🪙','🎁','🪙','🪙','🎁','🪙','🪙','🪙','🎁','🪙','🪙','🎁','🪙','🪙','🎁'];
      const premTiers=['uncommon','uncommon','rare','rare','rare','epic','rare','epic','epic','epic','epic','rare','epic','epic','legendary','epic','epic','rare','epic','epic','legendary','epic','epic','epic','epic','epic','epic','legendary','epic','legendary'];
      const freeVals=['640MM','640MM','640MM','Item','800MM','800MM','Item','1000MM','1000MM','Item Rare'];
      return {
        day:d,
        prem:{icon:premiumIcons[i]||'✨',name:`Hadiah ${d}`,tier:premTiers[i]||'rare',claimed:d<=8,today:d===9},
        free:{icon:freeIcons[i]||'🪙',name:d%5===0?'Item Acak':`${400+d*20} MM`,tier:d%5===0?'uncommon':'common',claimed:d<=8,today:d===9},
      };
    }),
  },
  detective:{
    theme:'detective',color:'var(--detective)',
    days:Array.from({length:30},(_,i)=>{
      const d=i+1;
      const premIcons=['🔍','🕵️','📎','🧥','🔦','🌫️','💼','🎩','🦅','⚜️','🗃️','📓','🔭','💡','🏛️','🎪','🔬','🌐','📡','🏆','💎','🧩','🎲','🔐','📜','🗝️','🧲','🔮','👁️','🌟'];
      const tiers=['uncommon','rare','rare','epic','rare','epic','epic','epic','epic','legendary','epic','rare','epic','epic','legendary','epic','epic','rare','epic','epic','legendary','epic','epic','epic','epic','epic','epic','legendary','epic','legendary'];
      return {
        day:d,
        prem:{icon:premIcons[i]||'⚜️',name:`Hadiah ${d}`,tier:tiers[i]||'rare',claimed:d<=8,today:d===9},
        free:{icon:'💎',name:d%5===0?'Item Khusus':`${500+d*25} MM`,tier:d%5===0?'rare':'common',claimed:d<=8,today:d===9},
      };
    }),
  },
};

let currentTab='dukun';
let currentPage=0;
const PAGES=3; // 3 pages of 10 days

function setTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.pass-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const fill=document.getElementById('sb-fill');
  fill.className=`sb-fill ${tab}`;
  document.getElementById('prog-label').textContent=tab==='detective'?'Kelas Detektif Aktif':'Kelas Dukun Aktif';
  currentPage=0;
  renderSlides();
}

function renderSlides(){
  const data=PASS[currentTab];
  const track=document.getElementById('slide-track');
  let html='';
  for(let p=0;p<PAGES;p++){
    const start=p*10;
    const pageDays=data.days.slice(start,start+10);
    const thm=currentTab;
    // Premium row (5 days)
    const premCells=pageDays.slice(0,5).map(d=>{
      const isLeg=d.prem.tier==='legendary';
      return `<div class="rw-cell premium ${thm}-theme${d.prem.claimed?' claimed':''}${d.prem.today?' today':''}${isLeg?' legendary-glow':''}">
        <div class="rw-day">D${d.day}</div>
        <div class="rw-icon">${d.prem.icon}</div>
        <div class="rw-name">${d.prem.name}</div>
        <div class="rw-tier ${d.prem.tier}">${d.prem.tier.toUpperCase()}</div>
        <div class="rw-bar ${d.prem.tier}"></div>
      </div>`;
    }).join('');
    const premCells2=pageDays.slice(5,10).map(d=>{
      const isLeg=d.prem.tier==='legendary';
      return `<div class="rw-cell premium ${thm}-theme${d.prem.claimed?' claimed':''}${d.prem.today?' today':''}${isLeg?' legendary-glow':''}">
        <div class="rw-day">D${d.day}</div>
        <div class="rw-icon">${d.prem.icon}</div>
        <div class="rw-name">${d.prem.name}</div>
        <div class="rw-tier ${d.prem.tier}">${d.prem.tier.toUpperCase()}</div>
        <div class="rw-bar ${d.prem.tier}"></div>
      </div>`;
    }).join('');
    // Free row
    const freeCells=pageDays.slice(0,5).map(d=>`
      <div class="rw-cell${d.free.claimed?' claimed':''}${d.free.today?' today':''}">
        <div class="rw-day">D${d.day}</div>
        <div class="free-label">FREE</div>
        <div class="rw-icon">${d.free.icon}</div>
        <div class="rw-name">${d.free.name}</div>
        <div class="rw-tier ${d.free.tier}">${d.free.tier.toUpperCase()}</div>
        <div class="rw-bar ${d.free.tier}"></div>
      </div>`).join('');
    const freeCells2=pageDays.slice(5,10).map(d=>`
      <div class="rw-cell${d.free.claimed?' claimed':''}${d.free.today?' today':''}">
        <div class="rw-day">D${d.day}</div>
        <div class="free-label">FREE</div>
        <div class="rw-icon">${d.free.icon}</div>
        <div class="rw-name">${d.free.name}</div>
        <div class="rw-tier ${d.free.tier}">${d.free.tier.toUpperCase()}</div>
        <div class="rw-bar ${d.free.tier}"></div>
      </div>`).join('');
    html+=`<div class="slide-page">
      <div style="font-size:clamp(7px,0.9vw,9px);letter-spacing:3px;color:var(--fear-dim);text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid var(--border-dim);">
        ▸ PREMIUM · HARI ${start+1}–${start+10}
      </div>
      <div class="rw-grid">${premCells}${premCells2}</div>
      <div style="font-size:clamp(7px,0.9vw,9px);letter-spacing:3px;color:var(--text-ghost);text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid var(--border-dim);">
        ▸ GRATIS · HARI ${start+1}–${start+10}
      </div>
      <div class="rw-grid">${freeCells}${freeCells2}</div>
    </div>`;
  }
  track.innerHTML=html;
  updateIndicator();
  applySlide();

  // Touch swipe
  let startX=0;
  const area=document.getElementById('slide-area');
  area.ontouchstart=e=>{startX=e.touches[0].clientX;};
  area.ontouchend=e=>{
    const dx=startX-e.changedTouches[0].clientX;
    if(Math.abs(dx)>40) slideTo(dx>0?currentPage+1:currentPage-1);
  };
}

function slideTo(p){
  currentPage=Math.max(0,Math.min(PAGES-1,p));
  applySlide();
  updateIndicator();
}

function applySlide(){
  document.getElementById('slide-track').style.transform=`translateX(-${currentPage*100}%)`;
}

function updateIndicator(){
  const dots=document.getElementById('dots');
  dots.innerHTML=Array.from({length:PAGES},(_,i)=>
    `<div class="pi-dot${i===currentPage?' active':''}" onclick="slideTo(${i})"></div>`
  ).join('');
}

function buyPass(tier){alert(`Membeli ${tier==='detective'?'Kelas Detektif (500 Robux)':'Kelas Dukun (200 Robux)'}...`);}

renderSlides();
</script>
</body>
</html>
