<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PASRAHPHOBIA — Game Over</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Oswald:wght@300;400;600;700&display=swap');
:root{--bg-void:#020408;--fear-blue:#0af;--fear-bright:#3cf;--text-primary:#c8dde8;--text-dim:rgba(180,210,230,0.5);--text-ghost:rgba(180,210,230,0.2);--glow-blue:0 0 8px #0af,0 0 20px rgba(0,170,255,0.3);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text-primary);font-family:'Share Tech Mono',monospace;}
.noise{position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");opacity:0.5;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 50%,#1a0008 0%,#000 70%);animation:bgFade 1s ease-out both;}
@keyframes bgFade{from{opacity:0}to{opacity:1}}
.root{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;}

/* SPLIT LAYOUT */
.go-layout{display:flex;align-items:center;gap:clamp(20px,4vw,48px);padding:0 max(16px,env(safe-area-inset-left,16px));width:100%;}

/* LEFT: title */
.go-left{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;}
.go-title{font-family:'Creepster',cursive;font-size:clamp(36px,8vw,80px);color:#800020;text-shadow:0 0 30px rgba(200,0,30,0.7),0 0 60px rgba(200,0,30,0.2);letter-spacing:6px;animation:bloodDrip 3s ease-in-out infinite alternate,goSlide 0.8s ease 0.2s both;}
@keyframes bloodDrip{from{text-shadow:0 0 20px rgba(200,0,30,0.4),0 0 40px rgba(200,0,30,0.2)}to{text-shadow:0 0 40px rgba(255,0,40,0.8),0 0 80px rgba(200,0,30,0.35)}}
@keyframes goSlide{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.go-sub{font-size:clamp(7px,1.1vw,10px);letter-spacing:5px;color:rgba(180,50,50,0.7);text-transform:uppercase;animation:glitch 5s ease-in-out infinite,goSlide 0.8s ease 0.4s both;}
@keyframes glitch{0%,95%,100%{transform:none;opacity:1}96%{transform:skewX(5deg);opacity:0.6}97%{transform:skewX(-3deg)}98%{transform:none}}

/* RIGHT: stats + buttons */
.go-right{flex:1;display:flex;flex-direction:column;gap:10px;animation:goSlide 0.8s ease 0.5s both;}

.go-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.go-stat{background:rgba(100,0,0,0.1);border:1px solid rgba(150,0,0,0.3);padding:clamp(6px,1.2vh,10px) 10px;text-align:center;}
.go-stat-val{font-family:'Oswald',sans-serif;font-size:clamp(18px,3vw,28px);font-weight:600;color:rgba(220,80,80,0.9);}
.go-stat-label{font-size:clamp(6px,0.8vw,8px);letter-spacing:2px;color:rgba(180,80,80,0.5);text-transform:uppercase;margin-top:2px;}

/* Ghost discovered */
.go-ghost{background:rgba(100,0,0,0.08);border:1px solid rgba(150,0,0,0.2);padding:clamp(6px,1.2vh,10px) 12px;display:flex;align-items:center;gap:10px;}
.go-ghost-icon{font-size:clamp(20px,3.5vw,30px);}
.go-ghost-info{}
.go-ghost-label{font-size:clamp(6px,0.8vw,8px);letter-spacing:2px;color:rgba(180,80,80,0.5);text-transform:uppercase;}
.go-ghost-name{font-family:'Oswald',sans-serif;font-size:clamp(12px,2vw,17px);font-weight:600;color:rgba(220,80,80,0.9);letter-spacing:2px;}

.go-btns{display:flex;gap:8px;}
.go-btn{flex:1;padding:clamp(8px,1.5vh,12px) 10px;background:transparent;border:1px solid rgba(200,0,30,0.3);color:rgba(200,80,80,0.8);font-family:'Share Tech Mono',monospace;font-size:clamp(8px,1.2vw,11px);letter-spacing:3px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;text-align:center;}
.go-btn:active{border-color:#f03;color:#f55;text-shadow:0 0 8px #f03;}
.go-btn.primary{border-color:rgba(200,0,30,0.5);color:rgba(220,100,100,0.9);}

/* DEATH NOTICE (spectator) */
.death-notice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:500;background:rgba(0,0,0,0.0);text-align:center;pointer-events:none;animation:dnFade 6s ease both;}
@keyframes dnFade{0%{opacity:0}10%{opacity:1}60%{opacity:1}80%{opacity:0;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-70%,-50%) scale(0.6)}}
.dn-text{font-family:'Creepster',cursive;font-size:clamp(14px,2.5vw,22px);color:rgba(200,80,80,0.9);letter-spacing:3px;line-height:1.6;text-shadow:0 0 12px rgba(200,0,30,0.5);}

.portrait-warn{display:none;position:fixed;inset:0;z-index:99999;background:#020408;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.portrait-warn .pw-icon{font-size:40px;animation:rotH 1.5s ease-in-out infinite;}
@keyframes rotH{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.portrait-warn .pw-text{font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}
@media(orientation:portrait){.portrait-warn{display:flex;}.root,.bg,.noise{display:none;}}
</style>
</head>
<body>
<div class="noise"></div><div class="bg"></div>
<div class="portrait-warn"><div class="pw-icon">📱</div><div class="pw-text">Putar perangkat ke landscape</div></div>

<!-- Death notice animation (appears first) -->
<div class="death-notice">
  <div class="dn-text">Kematian menipumu.<br>Yang kamu lihat belum tentu benar.</div>
</div>

<div class="root">
  <div class="go-layout">
    <div class="go-left">
      <div class="go-title">PASRAH</div>
      <div class="go-sub">Kamu tidak seharusnya datang ke sini</div>
    </div>
    <div class="go-right">
      <div class="go-stats">
        <div class="go-stat"><div class="go-stat-val">18:42</div><div class="go-stat-label">Waktu Bertahan</div></div>
        <div class="go-stat"><div class="go-stat-val">3</div><div class="go-stat-label">Petunjuk Ditemukan</div></div>
        <div class="go-stat"><div class="go-stat-val">12%</div><div class="go-stat-label">Sanity Akhir</div></div>
        <div class="go-stat"><div class="go-stat-val">7</div><div class="go-stat-label">Encounter</div></div>
      </div>
      <div class="go-ghost">
        <div class="go-ghost-icon">👻</div>
        <div class="go-ghost-info">
          <div class="go-ghost-label">GHOST YANG MEMBUNUHMU</div>
          <div class="go-ghost-name">KUNTILANAK</div>
        </div>
      </div>
      <div class="go-btns">
        <button class="go-btn primary">▶ COBA LAGI</button>
        <button class="go-btn">↩ MENU UTAMA</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
