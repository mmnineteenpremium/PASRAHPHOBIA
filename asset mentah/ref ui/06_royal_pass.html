<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PASRAHPHOBIA — Royal Pass</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Oswald:wght@300;400;600;700&display=swap');
:root{
  --bg-void:#020408;--bg-dark:#060d12;--bg-card:rgba(12,22,30,0.92);
  --border-dim:rgba(80,160,200,0.15);--fear-blue:#0af;--fear-bright:#3cf;
  --fear-dim:rgba(0,170,255,0.3);--text-primary:#c8dde8;
  --text-dim:rgba(180,210,230,0.5);--text-ghost:rgba(180,210,230,0.2);
  --glow-blue:0 0 8px #0af,0 0 20px rgba(0,170,255,0.3);
  --gold:#d4920a;--gold-dim:rgba(212,146,10,0.15);
  --detective:#9b59b6;--detective-dim:rgba(155,89,182,0.15);
  --dukun:#0cc;--dukun-dim:rgba(0,200,200,0.12);
  --common:#5a6472;--uncommon:#1fa862;--rare:#1470d4;--epic:#8820e0;--legendary:#d4920a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-void);color:var(--text-primary);font-family:'Share Tech Mono',monospace;}
.noise{position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.4;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(155,89,182,0.08) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(0,100,160,0.08) 0%,transparent 50%),#020408;}
.root{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{height:clamp(34px,5.5vh,42px);background:rgba(0,0,0,0.75);border-bottom:1px solid var(--border-dim);display:flex;align-items:center;padding:0 max(12px,env(safe-area-inset-left,12px));gap:10px;flex-shrink:0;}
.topbar-logo{font-family:'Creepster',cursive;font-size:clamp(12px,2vw,15px);color:var(--fear-blue);letter-spacing:2px;text-shadow:var(--glow-blue);}
.topbar-title{font-size:clamp(8px,1.1vw,10px);letter-spacing:4px;color:var(--text-dim);text-transform:uppercase;}

/* HEADER SEASON INFO */
.season-header{background:rgba(0,0,0,0.5);border-bottom:1px solid var(--border-dim);padding:clamp(6px,1.2vh,10px) max(12px,env(safe-area-inset-left,12px));display:flex;align-items:center;gap:clamp(12px,2vw,20px);flex-shrink:0;}
.sh-season{flex-shrink:0;}
.sh-season-label{font-size:clamp(6px,0.8vw,8px);letter-spacing:3px;color:var(--fear-dim);text-transform:uppercase;}
.sh-season-name{font-family:'Oswald',sans-serif;font-size:clamp(12px,2vw,17px);font-weight:600;letter-spacing:2px;color:var(--text-primary);}
.sh-progress{flex:1;}
.sh-prog-row{display:flex;justify-content:space-between;font-size:clamp(6px,0.8vw,8px);color:var(--text-dim);margin-bottom:4px;letter-spacing:1px;}
.sh-track{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.sh-fill{height:100%;background:linear-gradient(90deg,var(--fear-blue),var(--fear-bright));border-radius:3px;box-shadow:0 0 8px rgba(0,200,255,0.4);width:27%;position:relative;overflow:hidden;}
.sh-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shine 2s ease-in-out infinite;}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.sh-time{font-size:clamp(6px,0.8vw,8px);color:rgba(255,150,0,0.8);margin-top:3px;letter-spacing:1px;}
.sh-actions{display:flex;gap:6px;flex-shrink:0;}
.pass-buy-btn{padding:clamp(5px,1vh,8px) clamp(10px,1.8vw,16px);border:1px solid;font-family:'Share Tech Mono',monospace;font-size:clamp(7px,1vw,9px);letter-spacing:2px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:1px;}
.pass-buy-btn.detective{background:var(--detective-dim);border-color:rgba(155,89,182,0.5);color:var(--detective);}
.pass-buy-btn.detective:active{box-shadow:0 0 12px rgba(155,89,182,0.3);}
.pass-buy-btn.dukun{background:var(--dukun-dim);border-color:rgba(0,200,200,0.4);color:var(--dukun);}
.pass-buy-btn.dukun:active{box-shadow:0 0 12px rgba(0,200,200,0.3);}
.pass-price{font-size:clamp(6px,0.7vw,7px);opacity:0.7;}

/* PASS TABS */
.pass-tabs{display:flex;border-bottom:1px solid var(--border-dim);flex-shrink:0;}
.pass-tab{flex:1;padding:clamp(5px,1vh,8px);background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-ghost);font-family:'Share Tech Mono',monospace;font-size:clamp(7px,1vw,9px);letter-spacing:2px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:all 0.2s;text-align:center;}
.pass-tab.active.detective{border-bottom-color:var(--detective);color:var(--detective);}
.pass-tab.active.dukun{border-bottom-color:var(--dukun);color:var(--dukun);}

/* PASS CONTENT */
.pass-content{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* Reward track */
.track-wrap{flex:1;display:flex;flex-direction:column;gap:3px;padding:max(6px,1vh) max(10px,env(safe-area-inset-left,10px));overflow:hidden;}

.track-row{display:grid;align-items:center;gap:3px;flex:1;}
.track-row.premium{grid-template-columns:clamp(60px,9vw,80px) repeat(10,1fr) clamp(40px,6vw,60px);}
.track-row.free{grid-template-columns:clamp(60px,9vw,80px) repeat(10,1fr) clamp(40px,6vw,60px);}

.track-label{font-size:clamp(6px,0.8vw,8px);letter-spacing:2px;text-transform:uppercase;text-align:center;padding:4px;}
.track-label.premium.detective{color:var(--detective);}
.track-label.premium.dukun{color:var(--dukun);}
.track-label.free{color:var(--text-dim);}

.sep-row{height:4px;background:rgba(0,0,0,0.4);border-top:1px solid rgba(0,100,150,0.1);border-bottom:1px solid rgba(0,100,150,0.1);flex-shrink:0;}

.rw{background:var(--bg-card);border:1px solid var(--border-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer;touch-action:manipulation;transition:all 0.15s;overflow:hidden;min-height:clamp(52px,9vh,72px);}
.rw:active{transform:translateY(-1px);}
.rw.premium-tier{background:linear-gradient(135deg,rgba(20,50,90,0.4),rgba(10,30,60,0.6));}
.rw.claimed::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#0f8;font-size:clamp(14px,2.2vw,20px);}
.rw.current{border-color:var(--fear-bright);box-shadow:0 0 8px rgba(0,200,255,0.2);}
.rw.legendary-tier{animation:legGlow 2s ease-in-out infinite alternate;}
@keyframes legGlow{from{box-shadow:0 0 6px rgba(212,146,10,0.2)}to{box-shadow:0 0 16px rgba(212,146,10,0.5),0 0 30px rgba(212,146,10,0.15)}}
.rw-step{position:absolute;top:2px;left:3px;font-size:clamp(5px,0.7vw,6px);color:var(--text-ghost);}
.rw-icon{font-size:clamp(14px,2.2vw,20px);position:relative;}
.rw-name{font-size:clamp(5px,0.7vw,7px);color:var(--text-dim);text-align:center;position:relative;padding:0 2px;line-height:1.3;}
.rw-tier{font-size:clamp(5px,0.6vw,6px);text-transform:uppercase;letter-spacing:1px;position:relative;}
.rw-tier.legendary{color:var(--legendary);}
.rw-tier.epic{color:#b8f;}
.rw-tier.rare{color:#6af;}
.rw-tier.uncommon{color:#4f8;}
.rw-tier.common{color:var(--text-ghost);}
.rw-bar{position:absolute;bottom:0;left:0;right:0;height:2px;}
.rw-bar.legendary{background:var(--legendary);box-shadow:0 0 5px rgba(212,146,10,0.6);}
.rw-bar.epic{background:var(--epic);}
.rw-bar.rare{background:var(--rare);}
.rw-bar.uncommon{background:var(--uncommon);}

.portrait-warn{display:none;position:fixed;inset:0;z-index:99999;background:#020408;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.portrait-warn .pw-icon{font-size:40px;animation:rotH 1.5s ease-in-out infinite;}
@keyframes rotH{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.portrait-warn .pw-text{font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}
@media(orientation:portrait){.portrait-warn{display:flex;}.root,.bg,.noise{display:none;}}
</style>
</head>
<body>
<div class="noise"></div><div class="bg"></div>
<div class="portrait-warn"><div class="pw-icon">📱</div><div class="pw-text">Putar perangkat ke landscape</div></div>

<div class="root">
  <div class="topbar">
    <div class="topbar-logo">☠ PASRAHPHOBIA</div>
    <div style="width:1px;height:60%;background:var(--border-dim);"></div>
    <div class="topbar-title">ROYAL PASS</div>
  </div>

  <!-- SEASON HEADER -->
  <div class="season-header">
    <div class="sh-season">
      <div class="sh-season-label">SEASON 1</div>
      <div class="sh-season-name">MALAM TANPA AKHIR</div>
    </div>
    <div class="sh-progress">
      <div class="sh-prog-row"><span>Level <b style="color:var(--fear-bright)">10</b> / 30</span><span><b style="color:var(--fear-bright)">110</b> / 400 Jiwa</span></div>
      <div class="sh-track"><div class="sh-fill"></div></div>
      <div class="sh-time">⏱ Berakhir: 61 Hari 22 Jam</div>
    </div>
    <div class="sh-actions">
      <button class="pass-buy-btn dukun" onclick="buyPass('dukun')">
        KELAS DUKUN
        <span class="pass-price">200 Robux</span>
      </button>
      <button class="pass-buy-btn detective" onclick="buyPass('detective')">
        KELAS DETEKTIF
        <span class="pass-price">500 Robux</span>
      </button>
    </div>
  </div>

  <!-- TABS -->
  <div class="pass-tabs">
    <button class="pass-tab active dukun" onclick="setPassTab('dukun',this)" id="tab-dukun">KELAS DUKUN</button>
    <button class="pass-tab detective" onclick="setPassTab('detective',this)" id="tab-detective">KELAS DETEKTIF</button>
  </div>

  <!-- CONTENT -->
  <div class="pass-content" id="pass-content"></div>
</div>

<script>
const PASS_DATA={
  dukun:{
    color:'var(--dukun)',
    premium:[
      {step:1,icon:'🌙',name:'Ikon Bulan',tier:'uncommon',claimed:true},
      {step:3,icon:'🕸️',name:'Efek Sarang',tier:'uncommon',claimed:true},
      {step:6,icon:'🔮',name:'Aura Mistik',tier:'rare',claimed:true},
      {step:8,icon:'💀',name:'Tengkorak Animasi',tier:'rare',claimed:false,current:true},
      {step:10,icon:'👘',name:'Jubah Dukun',tier:'epic',claimed:false},
      {step:12,icon:'🌑',name:'Trail Gelap',tier:'rare',claimed:false},
      {step:15,icon:'🩸',name:'Partikel Darah',tier:'rare',claimed:false},
      {step:18,icon:'🎭',name:'Topeng Mistik',tier:'epic',claimed:false},
      {step:21,icon:'🌪️',name:'Aura Angin',tier:'epic',claimed:false},
      {step:25,icon:'🔱',name:'SKIN DUKUN',tier:'legendary',claimed:false},
    ],
    free:[
      {step:1,icon:'💰',name:'640 MM',tier:'common',claimed:true},
      {step:3,icon:'🎴',name:'185 Jiwa',tier:'common',claimed:true},
      {step:6,icon:'💀',name:'95 Token',tier:'common',claimed:true},
      {step:8,icon:'🎟️',name:'Tiket Khusus',tier:'uncommon',claimed:false,current:true},
      {step:10,icon:'💰',name:'640 MM',tier:'common',claimed:false},
      {step:12,icon:'🧿',name:'Avatar Jiwa',tier:'uncommon',claimed:false},
      {step:15,icon:'💰',name:'980 MM',tier:'common',claimed:false},
      {step:18,icon:'📛',name:'Badge Hantu',tier:'uncommon',claimed:false},
      {step:21,icon:'💰',name:'1200 MM',tier:'common',claimed:false},
      {step:25,icon:'🎁',name:'Box Kejutan',tier:'rare',claimed:false},
    ],
  },
  detective:{
    color:'var(--detective)',
    premium:[
      {step:1,icon:'🔍',name:'Ikon Lensa',tier:'uncommon',claimed:true},
      {step:3,icon:'🕵️',name:'Aura Detektif',tier:'rare',claimed:true},
      {step:6,icon:'📎',name:'Efek Rantai',tier:'rare',claimed:true},
      {step:8,icon:'🧥',name:'Jas Detektif',tier:'epic',claimed:false,current:true},
      {step:10,icon:'🔦',name:'Senter Kustom',tier:'rare',claimed:false},
      {step:12,icon:'🌫️',name:'Trail Kabut',tier:'epic',claimed:false},
      {step:15,icon:'💼',name:'Tas Investigasi',tier:'epic',claimed:false},
      {step:18,icon:'🎩',name:'Topi Detektif',tier:'epic',claimed:false},
      {step:21,icon:'🦅',name:'Efek Elang',tier:'epic',claimed:false},
      {step:25,icon:'⚜️',name:'SKIN DETEKTIF',tier:'legendary',claimed:false},
    ],
    free:[
      {step:1,icon:'💰',name:'800 MM',tier:'common',claimed:true},
      {step:3,icon:'🎴',name:'220 Jiwa',tier:'common',claimed:true},
      {step:6,icon:'💎',name:'120 Token',tier:'common',claimed:true},
      {step:8,icon:'🎟️',name:'Tiket Premium',tier:'rare',claimed:false,current:true},
      {step:10,icon:'💰',name:'800 MM',tier:'common',claimed:false},
      {step:12,icon:'🧿',name:'Avatar Elite',tier:'uncommon',claimed:false},
      {step:15,icon:'💰',name:'1200 MM',tier:'common',claimed:false},
      {step:18,icon:'📛',name:'Badge Elite',tier:'rare',claimed:false},
      {step:21,icon:'💰',name:'1500 MM',tier:'common',claimed:false},
      {step:25,icon:'🎁',name:'Box Detective',tier:'rare',claimed:false},
    ],
  },
};

let currentTab='dukun';

function setPassTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.pass-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderPass();
}

function renderPass(){
  const data=PASS_DATA[currentTab];
  const col=data.color;
  const prem=data.premium;
  const fr=data.free;

  const makeRw=(item,isPrem)=>{
    const cls=[
      'rw',
      isPrem?'premium-tier':'',
      item.claimed?'claimed':'',
      item.current?'current':'',
      item.tier==='legendary'?'legendary-tier':'',
    ].filter(Boolean).join(' ');
    return `<div class="${cls}">
      <div class="rw-step">${item.step}</div>
      <div class="rw-icon">${item.icon}</div>
      <div class="rw-name">${item.name}</div>
      <div class="rw-tier ${item.tier}">${item.tier.toUpperCase()}</div>
      <div class="rw-bar ${item.tier}"></div>
    </div>`;
  };

  document.getElementById('pass-content').innerHTML=`
    <div class="track-wrap">
      <div class="track-row premium">
        <div class="track-label premium ${currentTab}">✦ PREMIUM</div>
        ${prem.map(i=>makeRw(i,true)).join('')}
        <div class="track-label premium ${currentTab}" style="font-size:clamp(5px,0.7vw,7px);">LVL 25</div>
      </div>
      <div class="sep-row"></div>
      <div class="track-row free">
        <div class="track-label free">GRATIS</div>
        ${fr.map(i=>makeRw(i,false)).join('')}
        <div class="track-label free"></div>
      </div>
    </div>`;
}

function buyPass(tier){
  alert(`Membeli ${tier==='detective'?'Kelas Detektif (500 Robux)':'Kelas Dukun (200 Robux)'}...`);
}

renderPass();
</script>
</body>
</html>
